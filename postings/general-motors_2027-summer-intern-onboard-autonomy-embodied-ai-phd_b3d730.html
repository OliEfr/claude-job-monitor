    <meta name="description" property="og:description" content="Job Description Work Arrangement:  Hybrid: This internship is categorized as on-site. The selected intern is expected to report to the office 3 days a week.  Location:  Sunnyvale, CA  Seattle, WA About the Team The Onboard Autonomy team develops the real-time intelligence that enables autonomous vehicles to perceive their surroundings, plan safe and comfortable behavior, and operate reliably on the vehicle. Our work spans sensor fusion, structured perception, trajectory generation, ML planning, local planning, controls, guardrails, evaluation, and vehicle integration. We combine machine learning, robotics, optimization, and software engineering to build production-oriented autonomy systems that operate in real time and handle challenging driving scenarios. About the Role As an Onboard Autonomy Intern, you will contribute to a focused research or engineering project within the onboard driving stack. You will work with experienced researchers and engineers to prototype, evaluate, and improve algorithms or software using vehicle data, simulation, or production-oriented environments. Potential focus areas include: Sensor Encoders and Fusion: Convert camera, lidar, radar, and other sensor inputs into useful representations for autonomy. Structured Perception: Improve object tracking, online maps, scene understanding, and long-tail scenario handling. ML Planning and Trajectory Generation: Predict behavior, generate trajectories, and select safe driving actions. Local Planning and Controls: Balance collision avoidance, traffic rules, vehicle dynamics, kinematic feasibility, and passenger comfort. Guardrails and Integration: Validate and integrate autonomy components across vehicle platforms to support safe, reliable operation. What You’ll Do Prototype and evaluate algorithms for perception, prediction, planning, trajectory generation, controls, or integration. Work with real-world driving data and simulation to measure performance and investigate failures. Build data-processing, visualization, testing, and evaluation tools. Contribute to production-quality software through design reviews, code reviews, automated testing, continuous integration, and documentation. Analyze results, improve system performance, collaborate across disciplines, and present technical findings. Required Qualifications Currently pursuing a Ph.D. in Computer Science, Robotics, Electrical or Mechanical Engineering, Controls, Machine Learning, or a related STEM field. Experience through coursework, research, projects, or professional work in machine learning, computer vision, robotics, controls, optimization, or autonomous systems. Strong Python skills and experience with C++ or another systems programming language. Strong analytical, problem-solving, communication, and collaboration skills. Availability to work full-time, 40 hours per week, during the internship. Preferred Qualifications Experience with autonomous vehicles, ADAS, robotics, or ROS. Experience with PyTorch, TensorFlow, JAX, deep learning, transformers, multimodal learning, reinforcement learning, imitation learning, or trajectory prediction. Background in vehicle dynamics, feedback control, trajectory optimization, motion planning, safety-critical software, simulation, closed-loop evaluation, sensor data, large-scale datasets, or distributed computing. Intent to return to a degree program after the internship or co-op. Must be graduating between December 2027 and June 2028 Compensation:  The monthly salary range for this role is $14,600 per month   GM will provide a one-time lump sum taxable stipend payment to eligible students selected for the 2027 Student Program.  What You’ll Get from Us Paid U.S. GM holidays. GM Family First Vehicle Discount Program. Potential for growth within GM based on performance and business needs. Intern events and opportunities to network with company leaders and peers. Mentorship and hands-on experience with the data and ML foundations behind autonomy About GM Our vision is a world with Zero Crashes, Zero Emissions and Zero Congestion and we embrace the responsibility to lead the change that will make our world better, safer and more equitable for all. Why Join Us We believe we all must make a choice every day – individually and collectively – to drive meaningful change through our words, our deeds and our culture. Every day, we want every employee to feel they belong to one General Motors team. Benefits Overview From day one, we&#39;re looking out for your well-being–at work and at home–so you can focus on realizing your ambitions. Learn how GM supports a rewarding career that rewards you personally by visiting Total Rewards resources. Non-Discrimination and Equal Employment Opportunities (U.S.) General Motors is committed to being a workplace that is not only free of unlawful discrimination, but one that genuinely fosters inclusion and belonging. We strongly believe that providing an inclusive workplace creates an environment in which our employees can thrive and develop better products for our customers. All employment decisions are made on a non-discriminatory basis without regard to sex, race, color, national origin, citizenship status, religion, age, disability, pregnancy or maternity status, sexual orientation, gender identity, status as a veteran or protected veteran, or any other similarly protected status in accordance with federal, state and local laws. We encourage interested candidates to review the key responsibilities and qualifications for each role and apply for any positions that match their skills and capabilities. Applicants in the recruitment process may be required, where applicable, to successfully complete a role-related assessment(s) and/or a pre-employment screening prior to beginning employment. To learn more, visit How we Hire. Accommodations General Motors offers opportunities to all job seekers including individuals with disabilities.
