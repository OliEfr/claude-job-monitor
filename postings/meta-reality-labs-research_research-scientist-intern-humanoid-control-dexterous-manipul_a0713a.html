the algorithm on real robots. It involves working with research scientists and engineers together as a team, fast prototyping and rapid iterations of ideas, and debugging algorithms on real hardware.\n\nOur internships are twelve (12) to twenty-four (24) weeks long and we have various start dates throughout the year.","responsibilities":"Independently design, develop, and analyze novel research ideas related to robotic simulation and control, with a focus on loco-manipulation and dexterous manipulation.&nbsp;Deploy, test, and debug algorithms on real robots for sim-to-real transfer.&nbsp;Collaborate with other researchers and engineers across multiple disciplines.&nbsp;Communication of research agenda, progress and results to a diverse audience regularly.&nbsp;Publish research results at top conferences and release code that contributes to the field of robotics.","hiringOrganization":{"\u0040type":"Organization","name":"Meta","sameAs":"https:\/\/www.meta.com\/","logo":"https:\/\/static.xx.fbcdn.net\/rsrc.php\/y3\/r\/7ngPh_7s-rQ.webp"},"datePosted":"2026-11-03T10:23:08-08:00","jobLocation":[{"\u0040type":"Place","name":"Redmond, WA","address":{"\u0040type":"PostalAddress","addressLocality":"Redmond","addressRegion":"Washington","addressCountry":"US"}}],"qualifications":"Currently has or is in the process of obtaining a Ph.D. degree in robotics, computer graphics, computer vision, machine learning, or a related STEM field&nbsp;Experience with physics-based character animation, reinforcement learning and imitation learning, human motion synthesis and retargeting, forward and inverse kinematics and dynamics, numerical optimization&nbsp;Interpersonal experience: cross-group and cross-culture collaboration&nbsp;1+ years of experience with any of Python\/pytorch or C\/C++, and developing interactive graphics applications&nbsp;Must obtain work authorization in country of employment at the time of hire and maintain ongoing work authorization during employment Intent to return to degree program after the completion of the internship\/co-op&nbsp;2+ years experience with physical-base character animation and simulation and imitation learning&nbsp;Proven track record of achieving results as demonstrated in accepted papers at top conference and journal venues such as RSS, ICRA, IROS, CoRL, SIGGRAPH\/Asia\/TOG, CVPR, ICCV, ECCV, NeurIPS, ICLR, ICML etc&nbsp;Experience in contributing to open-source projects&nbsp;Experience in sim-to-real transfer and deploying simulated policies onto real robot hardware&nbsp;Experience with perception algorithms such as SLAM and pose estimation&nbsp;Experience working with tactile sensors","employmentType":"INTERN","directApply":true,"identifier":{"\u0040type":"PropertyValue","name":"Meta","value":"a1KiE0000004IsnUAE"}}</script><style nonce="S8fvTXKU">:root, .__fb-light-mode:root, .__fb-light-mode {--big-blue-40:#56A1EB;--big-blue-50:#2887E6;--big-blue-60:#066CD2;--big-blue-gray-5:#F5F7F8;--big-blue-gray-30:#CBD3DB;--big-chart-blue:#3d6ad6;--big-gray-10:#F3F4F4;--big-gray-20:rgb(233, 234, 235);--big-gray-30:#DADCDE;--big-gray-40:#C6C9CC;--big-gray-50:#ADB0B3;--big-gray-60:#929598;--big-green-40:#31B34E;--big-red-70:#A00024;--fds-active-icon:#3578E5;--fds-black-alpha-05:rgba(0, 0, 0, 0.05);--fds-black-alpha-10:rgba(0, 0, 0, 0.1);--fds-black-alpha-15:rgba(0, 0, 0, 0.15);--fds-black-alpha-20:rgba(0, 0, 0, 0.2);--fds-black-alpha-30:rgba(0, 0, 0, 0.3);--fds-black-alpha-40:rgba(0, 0, 0, 0.4);--fds-black-alpha-50:rgba(0, 0, 0, 0.5);--fds-black-alpha-60:rgba(0, 0, 0, 0.6);--fds-black-alpha-80:rgba(0, 0, 0, 0.8);--fds-black:#000000;--fds-blue-05:#ECF3FF;--fds-blue-30:#AAC9FF;--fds-blue-40:#77A7FF;--fds-blue-60:#1877F2;--fds-blue-70:#2851A3;--fds-blue-80:#1D3C78;--fds-blue-95:#E7F3FF;--fds-blue-badge:#3578E5;--fds-blue-link:#385898;--fds-button-icon:#444950;--fds-button-text:#444950;--fds-comment-background:#F2F3F5;--fds-dark-mode-gray-100:#1C1C1C;--fds-dark-mode-gray-35:#CCCCCC;--fds-dark-mode-gray-50:#828282;--fds-d
