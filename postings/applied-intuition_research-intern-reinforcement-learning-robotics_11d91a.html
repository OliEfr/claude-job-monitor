    <title>Research Intern - Reinforcement Learning, Robotics @ Applied Intuition</title><meta name="title" content="Research Intern - Reinforcement Learning, Robotics @ Applied Intuition" />
    
  
  <meta name="description" content="Applied Intuition, Inc. is powering the future of physical AI. Founded in 2017 and now valued at $15 billion, the Silicon Valley company is creating the digital infrastructure needed to bring intelligence to every moving machine on the planet. Applied Intuition services the automotive, defense, trucking, construction, mining and agriculture industries in three core areas: tools and infrastructure, operating systems, and autonomy. Eighteen of the top 20 global automakers, as well as the United States military and its allies, trust the company’s solutions to deliver physical intelligence. Applied Intuition is headquartered in Sunnyvale, California, with offices in Washington, D.C.; San Diego; Ft. Walton Beach, Florida; Ann Arbor, Michigan; London; Stuttgart; Munich; Stockholm; Bangalore; Seoul; and Tokyo. Learn more at applied.co http://applied.co.

We are an in-office company, and our expectation is that full-time employees primarily work from their Applied Intuition office 5 days a week. However, we also recognize the importance of flexibility and trust our employees to manage their schedules responsibly. This may include occasional remote work, starting the day with morning meetings from home before heading to the office, or leaving earlier when needed to accommodate family commitments. This in-office expectation does not apply to contractor positions


ABOUT THE ROLE:

We are looking for multiple passionate Research Interns to join the Research Group at Applied Intuition. The mission of the group is to create cutting-edge technology enabling next-generation physical AI, with emphasis on the two most challenging applications reshaping our everyday life: end-to-end autonomous driving and robotic generalist. We have a group composed of leading experts from top institutions and companies, recognized for their exceptional academic and industry contributions—including eight Best Paper awards at premier conferences and journals such as CVPR and ICRA. Learn more at appliedintuition.com/research.

Supported by industry-leading tools and infra, researchers can access millions of miles of data from large fleets, and deploy methods they develop into various autonomous and robotic systems including self-driving cars/trucks, autonomous mining/construction machines, humanoid robots and dexterous hands. In addition to your research contributions, you will contribute to and learn from best practices in the autonomy and robotics industries within our fast-paced and customer-focused culture. Improvements deployed to our system immediately help our customers with their programs and deliver value to our business.


AT APPLIED INTUITION, YOU WILL:

 - Conduct research on reinforcement learning (RL) related topics including large-scale closed-loop RL and VLA post-training with applications to robotics with emphasis on dexterous manipulation

 - Diving into fundamental and relevant topics on RL with broader applications

 - Work closely with the Research Scientists and Engineers on high quality research publications for submission to top-tier conferences


WE’RE LOOKING FOR SOMEONE WHO HAS:

 - Strong research background and skills on relevant topics, and the ability to work both independently and collaboratively on projects

 - Current PhD (or MSc) studies in machine learning, computer vision and graphics, robotics

 - 1+ year of research experience in autonomy, self-driving, or related field

 - Passion for next-generation, scalable autonomy and robotics

Don’t meet every single requirement? If you’re excited about this role but your past experience doesn’t align perfectly with every qualification in the job description, we encourage you to apply anyway. You may be just the right candidate for this or other roles.

Applied Intuition is an equal opportunity employer and federal contractor or subcontractor. Consequently, the parties agree that, as applicable, they will abide by the requirements of 41 CFR 60-1.4(a), 41 CFR 60-300.5(a) and 41 CFR 60-741.5(a) and that these laws are incorporated herein by reference. These regulations prohibit discrimination against qualified individuals based on their status as protected veterans or individuals with disabilities, and prohibit discrimination against all individuals based on their race, color, religion, sex, sexual orientation, gender identity or national origin. These regulations require that covered prime contractors and subcontractors take affirmative action to employ and advance in employment individuals without regard to race, color, religion, sex, sexual orientation, gender identity, national origin, protected veteran status or disability. The parties also agree that, as applicable, they will abide by the requirements of Executive Order 13496 (29 CFR Part 471, Appendix A to Subpart A), relating to the notice of employee rights under federal labor laws.

FOR US-BASED ROLES: Applied Intuition is committed to providing an accessible and inclusive application and interview experience to applicants who are disabled veterans and other applicants with disabilities or medical conditions. Reasonable accommodations are available, requesting an accommodation will not affect your candidacy in any way, and you are not required to disclose the nature of your disability or medical condition in order to make a request. If you require an accommodation please contact careers@applied.co. We will work with you!" />

 Ann Arbor, Michigan; London; Stuttgart; Munich; Stockholm; Bangalore; Seoul; and Tokyo. Learn more at <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"http://applied.co\">applied.co</a>.</p><p style=\"min-height:1.5em\"><em>We are an in-office company, and our expectation is that full-time employees primarily work from their Applied Intuition office 5 days a week. However, we also recognize the importance of flexibility and trust our employees to manage their schedules responsibly. This may include occasional remote work, starting the day with morning meetings from home before heading to the office, or leaving earlier when needed to accommodate family commitments. This in-office expectation does not apply to contractor positions</em></p><h2><strong>About the role:</strong></h2><p style=\"min-height:1.5em\">We are looking for multiple passionate Research Interns to join the Research Group at Applied Intuition. The mission of the group is to create cutting-edge technology enabling next-generation physical AI, with emphasis on the two most challenging applications reshaping our everyday life: end-to-end autonomous driving and robotic generalist. We have a group composed of leading experts from top institutions and companies, recognized for their exceptional academic and industry contributions—including eight Best Paper awards at premier conferences and journals such as CVPR and ICRA. Learn more at appliedintuition.com/research.</p><p style=\"min-height:1.5em\">Supported by industry-leading tools and infra, researchers can access millions of miles of data from large fleets, and deploy methods they develop into various autonomous and robotic systems including self-driving cars/trucks, autonomous mining/construction machines, humanoid robots and dexterous hands. In addition to your research contributions, you will contribute to and learn from best practices in the autonomy and robotics industries within our fast-paced and customer-focused culture. Improvements deployed to our system immediately help our customers with their programs and deliver value to our business.</p><h2><strong>At Applied Intuition, you will:</strong></h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Conduct research on reinforcement learning (RL) related topics including large-scale closed-loop RL and VLA post-training with applications to robotics with emphasis on dexterous manipulation</p></li><li><p style=\"min-height:1.5em\">Diving into fundamental and relevant topics on RL with broader applications</p></li><li><p style=\"min-height:1.5em\">Work closely with the Research Scientists and Engineers on high quality research publications for submission to top-tier conferences</p></li></ul><h2><strong>We’re looking for someone who has:</strong></h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Strong research background and skills on relevant topics, and the ability to work both independently and collaboratively on projects</p></li><li><p style=\"min-height:1.5em\">Current PhD (or MSc) studies in machine learning, computer vision and graphics, robotics</p></li><li><p style=\"min-height:1.5em\">1+ year of research experience in autonomy, self-driving, or related field</p></li><li><p style=\"min-height:1.5em\">Passion for next-generation, scalable autonomy and robotics</p></li></ul><p style=\"min-height:1.5em\"><em>Don’t meet every single requirement? If you’re excited about this role but your past experience doesn’t align perfectly with every qualification in the job description, we encourage you to apply anyway. You may be just the right candidate for this or other roles.</em></p><p style=\"min-height:1.5em\"><em>Applied Intuition is an equal opportunity employer and federal contractor or subcontractor. Consequently, the parties agree that, as applicable, they will abide by the requirements of 41 CFR 60-1.4(a), 41 CFR 60-300.5(a) and 41 CFR 60-741.5(a) and that these laws are incorporated herein by reference.
