    <meta name="description" property="og:description" content="NVIDIA Research is seeking research interns in Singapore to advance fundamental and applied robotics research, with a particular focus on agentic robotics. We are interested in exploring how AI agents can autonomously develop, refine, and generalize robotic capabilities by integrating reasoning, programming, experimentation, and feedback within the full robot systems stack. Our research spans robot learning, planning, simulation, perception, and control, with an emphasis on building intelligent systems that can generalize over tasks, environments, and embodiments. We are looking for interns with strong research and engineering skills, intellectual curiosity, and a collaborative mindset. You will have the opportunity to formulate and pursue ambitious research questions, develop novel algorithms and systems, and validate your ideas through rigorous experimentation. Research projects will be aligned with your expertise and the team&#39;s priorities, with opportunities to contribute to scientific publications and practical robotic systems. What you will be doing * Conduct research on novel models, algorithms, and systems for agentic robotics. * Investigate how AI agents can autonomously develop, evaluate, and improve robotic programs and capabilities. * Explore research directions at the intersection of foundation models, robot learning, planning, and programming. * Develop and evaluate methods for robotic skill acquisition, adaptation, and generalization. * Design and conduct experiments in simulation and, where appropriate, on physical robots. * Collaborate with researchers and engineers across robotics and AI, and communicate research outcomes through publications, demonstrations, open-source contributions, and presentation. What we need to see * Currently pursuing a PhD in robotics, artificial intelligence, computer science, mechanical engineering, electrical engineering, or a related field. * Strong technical foundation in robotics, AI, or related areas, with an interest in real-world robotic systems. * Demonstrated ability to conduct independent research, evidenced by publications, impactful projects, or substantial research contributions. * Strong programming skills and experience in developing research software. * Ability to formulate research questions, implement novel methods, and rigorously evaluate experimental results. * Excellent problem-solving, communication, and collaboration skills. Ways to stand out from the crowd * Research experience in AI coding agents, robotics, foundation models, or program synthesis. * Expertise in one or more areas such as robot learning, planning, simulation, perception, control, ... * Familiarity with robotics and simulation platforms such as ROS 2, Isaac Sim, Isaac Lab, or MuJoCo. * Experience implementing and validating methods on real robotic systems. * Publications at leading robotics conferences and journals, such as RSS, CoRL, ICRA, IROS, T-RO, IJRR, or RA-L. Join NVIDIA Research to explore how AI agents can transform robotics research and industry. NVIDIA pioneered accelerated computing. Today, our AI infrastructure powers global intelligence, transforming every industry. Learn more about NVIDIA.">
