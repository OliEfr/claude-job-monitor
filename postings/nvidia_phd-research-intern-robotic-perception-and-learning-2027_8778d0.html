    <meta name="title" property="og:title" content="PhD Research Intern, Robotic Perception and Learning - 2027">
    <meta name="description" property="og:description" content="The Robotic Visual Perception and Learning research group, part of NVIDIA’s Learning and Perception Group Research is looking for highly motivated PhD students for research internships. We are passionate about research that pushes boundaries, but also has impact in the real world. Our interns regularly publish their internship works in top-tier conferences in computer vision, robotics and machine learning. We have many experienced mentors in the team and our interns often choose to return for another internship. We carefully craft internship projects such that they match the interns&#39; expertise. What you&#39;ll be doing: Reproduce existing state-of-the-art computer vision methods Research, design, and implement novel deep learning algorithms to push the state of the art in computer vision, robotics, and control Publish original research Collaborate with other team members, research teams, and product teams Transfer technology to product groups What we need to see: Pursuing a Ph.D. in Computer Science/Engineering, Electrical Engineering, Robotics or related field. Excellent knowledge of theory and practice of computer vision methods, deep learning, robotics, and/or control. Expertise in one or more of the following areas: 3D computer vision, reinforcement learning, real-to-sim-to-real, tactile sensing, or robotic manipulation. Excellent programming skills in some rapid prototyping environment such as Python (C++ and/or CUDA is a plus). Knowledge of common machine learning frameworks, such as PyTorch. Proven track record of publication in top-tier conferences. Excellent communications and analytical skills. NVIDIA is widely considered to be one of the technology world&#39;s most desirable employers. We have some of the most forward-thinking and productive people in the world working for us. If you&#39;re creative and autonomous, we want to hear from you! With competitive salaries and a generous benefits package, NVIDIA is widely considered to be one of the technology world’s most desirable employers. We have some of the most forward-thinking and hardworking people in the world working for us and, due to unprecedented growth, our best-in-class research teams are rapidly growing. Our internship hourly rates are a standard pay based on the position, your location, year in school, degree, and experience. The hourly rate for our interns is 38 USD - 94 USD. You will also be eligible for Intern benefits. Applications for this job will be accepted at least until October 25, 2026. This posting is for an existing vacancy. NVIDIA uses AI tools in its recruiting processes. NVIDIA is committed to fostering an inclusive work environment and proud to be an equal opportunity employer. As we highly value diversity in our current and future employees, we do not discriminate (including in our hiring and promotion practices) on the basis of race, religion, color, national origin, gender, gender expression, sexual orientation, age, marital status, veteran status, disability status or any other characteristic protected by law. NVIDIA pioneered accelerated computing. Today, our AI infrastructure powers global intelligence, transforming every industry. Learn more about NVIDIA.">
