power people around the world to build community and connect in meaningful ways. Together, we can help people build stronger communities \u2014 we\u2019re just getting started.\n\nMeta Reality Labs Research is looking for upcoming scientists and researchers with great interest in algorithm\/hardware co-design and acceleration of efficient sensing and ML algorithms for robotics and AR\/VR applications. Our team specializes in developing state-of-the-art hardware-optimized algorithms for machine perception. With our vision of muti-sensor-assisted robots, our team is focusing on cutting-edge intelligent systems that can enable robotics to perform complex real-world tasks. This internship will focus on foundational AI technologies around robotics, multimodal understanding (audio, visual, spatial, chemical, etc), privacy, or others that support robotic tasks.\n\nOur internships are twelve (12) to twenty-four (24) weeks long and we have various start dates throughout the year.","responsibilities":"Research, development, optimization, and deployment of ML and non-ML algorithms for edge computing devices&nbsp;Research on novel ML or computational imaging algorithms for robotics\/AR\/VR applications&nbsp;Collaboration with and support of other researchers across various disciplines&nbsp;Communication of research agenda, progress, and results&nbsp;Prototyping, building and characterizing experimental systems and custom hardware","hiringOrganization":{"\u0040type":"Organization","name":"Meta","sameAs":"https:\/\/www.meta.com\/","logo":"https:\/\/static.xx.fbcdn.net\/rsrc.php\/y3\/r\/7ngPh_7s-rQ.webp"},"datePosted":"2026-11-18T20:03:39-08:00","jobLocation":[{"\u0040type":"Place","name":"Burlingame, CA","address":{"\u0040type":"PostalAddress","addressLocality":"Burlingame","addressRegion":"California","addressCountry":"US"}}],"qualifications":"Currently has, or is in the process of obtaining a  PhD in the fields of Computer Science, Electrical Engineering, Robotics, or related field&nbsp;Must obtain work authorization in the country of employment at the time of hire and maintain ongoing work authorization during employment&nbsp;2+ years research experience in one or more of the following: Developing machine learning and computer vision models, Optimization of edge computing algorithms, and\/or Distributed compute architectures&nbsp;2+ years experience programming in Python\/C++&nbsp;Experience with Deep Learning frameworks (Pytorch, TensorFlow, etc)&nbsp;Interpersonal skills: cross-group and cross-culture collaboration Experience with vision-language-action models (VLA), world-action models (WAM) or other foundation models for robotics&nbsp;Experience in multimodal ML algorithms (monocular\/stereo depth, object detection, segmentation, tracking, keyword spotting, ASR, etc)&nbsp;Experience in deploying real-time ML algorithms to edge\/mobile platforms&nbsp;Experience with NAS or developing and deploying algorithms on resource-constrained  hardware is a plus&nbsp;Experience with pretraining using self-supervised learning is a plus&nbsp;Experience with tuning LLMs&nbsp;Experience in privacy-preserving ML algorithms&nbsp;Proven track record of achieving significant results, as demonstrated by first- and\/or co-authored publications at leading workshops or conferences, e.g., CVPR, ICCV, NeurIPS, ICML, ICLR, ICRA, CoRL, IROS, ISCA, MICRO, SC, AAAI, IJCAI, ACL, COLM, patents, or grants&nbsp;Intent to return to the degree program after the internship and availability for at least sixteen (16) consecutive weeks","employmentType":"INTERN","directApply":true,"identifier":{"\u0040type":"PropertyValue","name":"Meta","value":"a1KiE000000536vUAA"}}</script><style nonce="BLbJRRHf">:root, .__fb-light-mode:root, .__fb-light-mode {--big-blue-40:#56A1EB;--big-blue-50:#2887E6;--big-blue-60:#066CD2;--big-blue-gray-5:#F5F7F8;--big-blue-gray-30:#CBD3DB;--big-chart-blue:#3d6ad6;--big-gray-10:#F3F4F4;--big-gray-20:rgb(233, 234, 235);--big-gray-30:#DADCDE;--big-gray
