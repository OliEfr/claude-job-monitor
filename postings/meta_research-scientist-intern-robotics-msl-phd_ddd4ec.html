ol, navigation, mobile manipulation, dexterous manipulation, and vision-language models. You should have a keen interest in producing new, open science to make embodied agents more intelligent. These crucial projects and initiatives taken on by this team have never been done before, so you have a rare opportunity to help us create new ways people connect around the world.\n\nOur internships are twelve (12) to twenty-four (24) weeks long and we have various start dates throughout the year. \n","responsibilities":"Perform fundamental and applied research to push the scientific and technological frontiers of embodied artificial intelligence.&nbsp;Collaborate with research scientists and engineers to design and implement state-of-the-art AI algorithms and models.&nbsp;Invent\/improve novel data-driven paradigms for robotics, leveraging a variety of modalities (images, video, text, audio, tactile, etc).&nbsp;Investigate paradigms that can deliver a spectrum of embodied behaviors - from simulated characters to real robots, and from short-horizon, low-level to long-horizon, high-level intelligence.&nbsp;Develop algorithms based on state-of-the-art machine learning and neural network methodologies.&nbsp;Build and benchmark new capabilities needed for the next generation of AI.&nbsp;Conduct research towards long-term research goals while identifying intermediate milestones.","hiringOrganization":{"\u0040type":"Organization","name":"Meta","sameAs":"https:\/\/www.meta.com\/","logo":"https:\/\/static.xx.fbcdn.net\/rsrc.php\/y3\/r\/7ngPh_7s-rQ.webp"},"datePosted":"2026-10-01T14:21:42-07:00","jobLocation":[{"\u0040type":"Place","name":"Menlo Park, CA","address":{"\u0040type":"PostalAddress","addressLocality":"Menlo Park","addressRegion":"California","addressCountry":"US"}}],"qualifications":"Currently has or is in the process of obtaining a Ph.D. degree in Computer Science, Computer Engineering, Artificial Intelligence, Robotics, Computer Vision, Machine Learning or related STEM field&nbsp;Experience with any of the following research areas: robotics, motion planning, embodied AI, human-robot interaction, sim-to-real transfer, learning from demonstration, reinforcement learning, dexterous manipulation, digital agents, vision language models, computer vision, egocentric perception, and\/or LLMs&nbsp;Experience with machine learning models, and frameworks such as PyTorch, TensorFlow, etc&nbsp;Interpersonal experience: cross-group and cross-culture collaboration&nbsp;Must obtain work authorization in country of employment at the time of hire and maintain ongoing work authorization during employment Intent to return to degree program after the completion of the internship\/co-op&nbsp;Proven track record of achieving significant results as demonstrated by accepted papers in top conferences or journals such as (NeurIPS, ICML, ICLR), Robotics (ICRA, IROS, RSS, CoRL), Computer Vision (CVPR, ICCV, ECCV)&nbsp;1+ years of experience in robotics or related field, or advanced degree with equivalent experience&nbsp;Experience designing and developing new robotic systems, platforms or infrastructure&nbsp;Experience with manipulating and analyzing complex, large scale, high-dimensionality data from varying sources&nbsp;Experience solving complex problems and comparing alternative solutions, trade-offs, and diverse points of view to determine a path forward&nbsp;Experience working and communicating cross functionally in a team environment&nbsp;Experience building systems based on machine learning and\/or deep learning methods","employmentType":"INTERN","directApply":true,"identifier":{"\u0040type":"PropertyValue","name":"Meta","value":"a1KiE00000026ZBUAY"}}</script><style nonce="3M1i5FdM">:root, .__fb-light-mode:root, .__fb-light-mode {--big-blue-40:#56A1EB;--big-blue-50:#2887E6;--big-blue-60:#066CD2;--big-blue-gray-5:#F5F7F8;--big-blue-gray-30:#CBD3DB;--big-chart-blue:#3d6ad6;--big-gray-10:#F3F4F4;--big-gray-20:rgb(233, 234, 235);--big-gray-30:#DADCDE;--bi
